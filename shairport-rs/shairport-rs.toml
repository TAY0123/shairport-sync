[server]
bind = "127.0.0.1:3689"

[airplay]
enabled = true
airplay2_enabled = true
# Empty PIN = no password required. Set a PIN (e.g. "3939") to enable the
# AirPlay password prompt.
pin = ""
bind = "0.0.0.0:8197"
device_id = "00:11:22:33:44:55"
audio_port = 6000
control_port = 6001
timing_port = 6002
transcript_path = "logs/ap2-transcript.jsonl"

[mdns]
backend = "auto"
service_name = "Shairport RS"
hostname = "shairport-rs"

[audio]
backend = "cpal"
host = "default"

[ptp]
enabled = true
backend = "embedded"
event_port = 319
general_port = 320
