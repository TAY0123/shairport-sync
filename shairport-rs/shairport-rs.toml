[server]
bind = "127.0.0.1:3689"

[airplay]
enabled = true
airplay2_enabled = true
# Empty PIN = no user-facing AirPlay password. Set a value to require one.
pin = ""
bind = "0.0.0.0:7000"
device_id = "00:11:22:33:44:55"
audio_port = 6000
control_port = 6001
timing_port = 6002

[mdns]
backend = "auto"
service_name = "Shairport RS"
hostname = "shairport-rs"

[audio]
backend = "cpal"
host = "default"

[ptp]
enabled = true
backend = "embedded"
event_port = 319
general_port = 320

[system_media]
# Publish now-playing metadata and accept OS media keys via MPRIS/SMTC/Control Center.
enabled = true
identity = "Shairport RS"
bus_name = "ShairportRS"
desktop_entry = "shairport-rs"
